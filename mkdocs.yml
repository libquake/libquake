site_name: libquake
site_description: C++ library for Quake 1 map, bsp and wad files
site_author: Tino Gohlert
repo_url: https://github.com/libquake/libquake
repo_name: libquake/libquake

docs_dir: docs

theme:
  name: material
  variant: modern
  palette:
    - scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Guide:
      - Getting started: guide/getting-started.md
      - Loading a bsp: guide/bsp.md
      - Building a map: guide/map.md
      - Lighting: guide/lighting.md
      - Textures: guide/textures.md
      - C API: guide/c-api.md
  - Reference:
      - Level: reference/level.md
      - Loading: reference/loading.md
      - Lighting: reference/lighting.md
      - Wad: reference/wad.md
      - C API: reference/c-api.md
  - qviewer: tools/qviewer.md

plugins:
  - search

markdown_extensions:
  - admonition
  - def_list
  - tables
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # examples/ is compiled with QLIB_BUILD_EXAMPLES, the guide includes it from there
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - toc:
      permalink: true
